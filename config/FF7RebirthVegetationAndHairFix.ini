[VegetationAndHairFix]
; 1 = patched shaders, 0 = the game's original dithering. Also toggled from the ReShade overlay.
Enabled=1
; Scenery (trees, plants, grass and everything else that isn't a character): pixels more opaque than this are drawn.
; Lower = fuller leaves, higher = thinner.
SceneryThreshold=0.33
; 0 = no dithering (clean alpha test), 1 = the game's original dithering. Threshold 0.50 with 1.00 is the game's own
; test, which leaves those shaders alone.
SceneryDitherStrength=0.00
; Characters (hair, fur and clothing). With SoftEdges=1, parts more opaque than Threshold are drawn solid and the thin,
; see-through parts are blended over the scene (DitherStrength is then not used). With SoftEdges=0, Threshold and
; DitherStrength work as for scenery; 0.50 / 1.00 is the game's own dithering.
SoftEdges=1
Threshold=0.50
DitherStrength=1.00
; How much of the thin, see-through part is blended in, as a share of Threshold: the blend fades in from
; Threshold * (1 - SoftEdgeSoftness). Higher = softer, wispier edges, lower = closer to a clean cutout.
SoftEdgeSoftness=0.70
; Optional hotkey that toggles soft edges (for comparison), as a Windows virtual-key code (117 = F6). 0 = none.
; With Shift, it cycles debug views (blend opacity, blend colour, solid parts).
SoftEdgesKey=0
; Optional hotkey that toggles the fix, as a Windows virtual-key code (119 = F8). 0 = none.
ToggleKey=0
; Developer options.
DumpShaders=0
TraceKey=0
